name: Validate hardware sign-offs
on:
  push:
    branches: [codex/pr33-signoff-validation]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a4ff55a25e5031502880d71d75aedc4366166ed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python -c 'import os, tomllib; assert os.environ["TAG"] == "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]'
      - name: Reuse the unchanged hardware wheel
        if: inputs.reuse_package_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: hardware-packages
          path: out/reused
          run-id: ${{ inputs.reuse_package_run_id }}
          github-token: ${{ github.token }}
      - name: Build the distribution once for all jobs
        env:
          REUSE_PACKAGE_RUN_ID: ${{ inputs.reuse_package_run_id }}
        run: |
          args=()
          if [[ -n "$REUSE_PACKAGE_RUN_ID" ]]; then
            args+=(--sdist)
            mkdir -p dist
            cp out/reused/*.whl dist/
          fi
          python -m pip install build
          python -m build "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 2
  test:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a4ff55a25e5031502880d71d75aedc4366166ed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: hardware-packages
          path: out/packages
      - run: python -m pip install out/packages/*.whl && python -m pip check
      - name: Test the installed package and built kernel resources
        run: |
          wheels=(out/packages/*.whl)
          [[ ${#wheels[@]} -eq 1 && -f "${wheels[0]}" ]]
          ORCHARD_HARDWARE_WHEEL="${wheels[0]}" python -m unittest discover -s tests -v
  native-smoke:
    needs: test
    runs-on: ubuntu-24.04-arm
    env:
      ORCHARD_BUILD_NATIVE: '1'
      ORCHARD_BUILD_ENV_ID: ubuntu-24.04-arm-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a4ff55a25e5031502880d71d75aedc4366166ed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: hardware-packages
          path: out/packages
      - run: python -m pip install out/packages/*.whl
      - name: Compile and execute through the native recipe runner
        run: |
          mkdir -p out/native-source out/native-output
          printf 'int main(void) { return 0; }\n' > out/native-source/test.c
          # shellcheck disable=SC2016
          python -m orchard_hardware.buildenv run --image unused-native \
            --bind "$PWD/out/native-source:/src:ro" --bind "$PWD/out/native-output:/out:rw" --cwd /src -- \
            bash -euc 'cc "$ORCHARD_SRC/test.c" -o "$ORCHARD_OUT/test"; "$ORCHARD_OUT/test"'
          test -s out/native-output/test
